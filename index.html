<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portafolio personal de Johanna Barragán, Consultora en Inteligencia Artificial.">
    <title>Johanna Barragán | Portafolio</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <!-- ENCABEZADO: nombre, profesión y menú de navegación -->
    <header class="encabezado">
        <p class="encabezado__marca">Johanna Barragán</p>
        <nav class="navegacion">
            <!-- Menú de navegación -->
        </nav>
    </header>

    <main>

        <!-- SECCIÓN PRINCIPAL: título, descripción breve e imagen -->
        <section id="inicio" class="seccion">
            <!-- Presentación principal -->
        </section>

        <!-- SOBRE MÍ: quién soy, intereses y objetivos -->
        <section id="sobre-mi" class="seccion">
            <!-- Sobre mí -->
        </section>

        <!-- HABILIDADES: mínimo cuatro habilidades -->
        <section id="habilidades" class="seccion">
            <!-- Habilidades -->
        </section>

        <!-- PROYECTOS: mínimo dos proyectos con nombre, descripción, imagen y enlace -->
        <section id="proyectos" class="seccion">
            <!-- Proyectos con etiquetas article-->
        </section>

        <!-- CONTACTO: formulario visual con nombre, correo, mensaje y botón -->
        <section id="contacto" class="seccion">
            <!-- Formulario de contacto -->
        </section>

    </main>

    <!-- PIE DE PÁGINA: nombre, año y enlace a GitHub -->
    <footer class="pie">
        <!-- Pie de página -->
    </footer>

</body>
</html>
